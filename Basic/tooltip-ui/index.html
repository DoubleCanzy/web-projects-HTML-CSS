<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip UI — 纯 CSS 导航气泡提示</title>

    <!-- ===== SEO 标签 ===== -->
    <meta name="description" content="纯 HTML + CSS 实现的导航 Tooltip：悬停时在导航项上方弹出提示气泡，含箭头与五种不同入场动画，无需 JavaScript。">
    <meta name="author" content="DoubleCanzy">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://doublecanzy.github.io/web-projects-HTML-CSS/Basic/tooltip-ui/">

    <!-- ===== Open Graph 标签（社交分享用） ===== -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Tooltip UI — 纯 CSS 导航气泡提示">
    <meta property="og:description" content="悬停弹出 tooltip 的导航组件，纯 CSS 实现。">
    <meta property="og:url" content="https://doublecanzy.github.io/web-projects-HTML-CSS/Basic/tooltip-ui/">
    <meta property="og:locale" content="zh_CN">

    <!-- ===== Google Fonts（提升排版） ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- ===== 样式表 ===== -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="page">

        <!-- ===== 导航栏 =====
             每个导航项：图标 + 悬停时在上方弹出 tooltip。
             无障碍：链接带 aria-label；tooltip 为装饰性重复，aria-hidden -->
        <nav class="nav" aria-label="主导航">
            <ul>

                <li class="nav-item">
                    <a href="#" aria-label="Home">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </a>
                    <span class="tooltip" aria-hidden="true">Home</span>
                </li>

                <li class="nav-item active">
                    <a href="#" aria-label="Projects">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                    </a>
                    <span class="tooltip" aria-hidden="true">Projects</span>
                </li>

                <li class="nav-item">
                    <a href="#" aria-label="Blog">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                    </a>
                    <span class="tooltip" aria-hidden="true">Blog</span>
                </li>

                <li class="nav-item">
                    <a href="#" aria-label="FAQ">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                            <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                    </a>
                    <span class="tooltip" aria-hidden="true">FAQ</span>
                </li>

                <li class="nav-item">
                    <a href="#" aria-label="Contact">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                    </a>
                    <span class="tooltip" aria-hidden="true">Contact</span>
                </li>

            </ul>
        </nav>

    </main>

</body>
</html>
