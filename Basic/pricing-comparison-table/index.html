<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订阅方案对比 — Pricing Comparison Table</title>

    <!-- ===== SEO 标签 ===== -->
    <meta name="description" content="三个订阅方案（Basic / Pro / Premium）的功能与价格对比表：使用语义化 table、caption、thead/tbody/tfoot 与 scope 属性构建的无障碍数据表。">
    <meta name="author" content="DoubleCanzy">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://doublecanzy.github.io/web-projects-HTML-CSS/Basic/pricing-comparison-table/">

    <!-- ===== Open Graph 标签（社交分享用） ===== -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="订阅方案对比 — Pricing Comparison Table">
    <meta property="og:description" content="语义化 HTML 表格：三个订阅方案的功能与价格对比。">
    <meta property="og:url" content="https://doublecanzy.github.io/web-projects-HTML-CSS/Basic/pricing-comparison-table/">
    <meta property="og:locale" content="zh_CN">

    <!-- 注意：本页按项目要求不做任何样式，仅结构 -->
</head>
<body>

    <!-- ===== 页面语义结构：header / main / footer ===== -->
    <header>
        <h1>订阅方案对比</h1>
        <p>三个方案并排比较，帮你选择最适合的一个。</p>
    </header>

    <main>

        <!-- ===== 数据表 =====
             caption 是 table 的第一个子元素，说明表格内容 -->
        <table>
            <caption>Basic、Pro、Premium 三个订阅方案的功能与价格对比</caption>

            <!-- 表头行：列标题用 scope="col" -->
            <thead>
                <tr>
                    <th scope="col">功能</th>
                    <th scope="col">Basic</th>
                    <th scope="col">Pro</th>
                    <th scope="col">Premium</th>
                </tr>
            </thead>

            <tbody>

                <!-- 数据行：行标题（方案名/功能名）用 scope="row" -->
                <tr>
                    <th scope="row">价格</th>
                    <td>免费</td>
                    <td>¥68 / 月</td>
                    <td>¥168 / 月</td>
                </tr>

                <!-- 分组标题行：colspan="4" 跨整行 + scope="colgroup" 标记列组 -->
                <tr>
                    <th colspan="4" scope="colgroup">核心功能</th>
                </tr>

                <tr>
                    <th scope="row">AI 智能助手</th>
                    <td>—</td>
                    <td>✓</td>
                    <td>✓</td>
                </tr>

                <tr>
                    <th scope="row">项目数量</th>
                    <td>3 个</td>
                    <td>不限</td>
                    <td>不限</td>
                </tr>

                <tr>
                    <th scope="row">团队成员</th>
                    <td>1 人</td>
                    <td>10 人</td>
                    <td>不限</td>
                </tr>

                <tr>
                    <th scope="row">自定义域名</th>
                    <td>—</td>
                    <td>✓</td>
                    <td>✓</td>
                </tr>

                <!-- 第二个分组标题行 -->
                <tr>
                    <th colspan="4" scope="colgroup">支持服务</th>
                </tr>

                <tr>
                    <th scope="row">客服支持</th>
                    <td>社区论坛</td>
                    <td>邮件支持</td>
                    <td>24/7 优先支持</td>
                </tr>

                <tr>
                    <th scope="row">数据分析</th>
                    <td>基础报表</td>
                    <td>高级报表</td>
                    <td>全部功能</td>
                </tr>

            </tbody>

            <!-- 表尾：优惠提示行，colspan="4" 跨整行 -->
            <tfoot>
                <tr>
                    <td colspan="4">🎉 年付方案立省 20%</td>
                </tr>
            </tfoot>

        </table>

    </main>

    <footer>
        <p>© 2026 · 定价信息仅供参考 </p>
    </footer>

</body>
</html>
