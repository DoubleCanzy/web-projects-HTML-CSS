<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张三 · 联系 — 前端开发工程师</title>

    <!-- ===== SEO 标签 ===== -->
    <meta name="description" content="联系张三：通过表单发送姓名、邮箱与留言，交流前端开发相关问题或合作意向。">
    <meta name="keywords" content="张三, 前端开发工程师, 联系方式, 联系表单">
    <meta name="author" content="张三">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://doublecanzy.github.io/web-projects-HTML-CSS/Basic/portfolio-website/contact">

    <!-- ===== Open Graph 标签（社交分享用） ===== -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="张三 · 联系 — 前端开发工程师">
    <meta property="og:description" content="联系张三：通过表单发送姓名、邮箱与留言。">
    <meta property="og:url" content="https://doublecanzy.github.io/web-projects-HTML-CSS/Basic/portfolio-website/contact">
    <meta property="og:locale" content="zh_CN">

    <!-- ===== Google Fonts（加分项：提升排版） ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">

    <!-- ===== favicon 与样式表 ===== -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- 头部：姓名/logo + 全局导航（四个页面相同，仅 active 项不同） -->
    <header class="site-header">
        <div class="header-inner">
            <a class="logo" href="index.html">张三</a>

            <nav class="main-nav" aria-label="主导航">
                <ul>
                    <li><a href="index.html">首页</a></li>
                    <li><a href="projects.html">项目</a></li>
                    <li><a href="articles.html">文章</a></li>
                    <li><a class="active" href="contact.html">联系</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">

            <header class="page-header">
                <h1>联系我</h1>
                <p class="subtitle">对项目或合作感兴趣？填写下面的表单，我会尽快回复你。</p>
            </header>

            <section class="contact-card" id="contact-form">

                <form action="#" method="post">

                    <div class="form-group">
                        <label for="name">姓名</label>
                        <input type="text" id="name" name="name" placeholder="你的名字" required>
                    </div>

                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">主题</label>
                        <input type="text" id="subject" name="subject" placeholder="想聊点什么？">
                    </div>

                    <div class="form-group">
                        <label for="message">留言</label>
                        <textarea id="message" name="message" rows="5" placeholder="写下你想说的话……" required></textarea>
                    </div>

                    <button class="btn" type="submit">发送</button>

                </form>

            </section>

        </div>
    </main>

    <!-- 页脚：版权信息（四个页面相同） -->
    <footer class="site-footer">
        <p>© 2026 张三 · 保留所有权利</p>
    </footer>

</body>
</html>
